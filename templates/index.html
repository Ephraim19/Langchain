<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangChain RAG System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/8.0.0/marked.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-10">
            <h1 class="text-3xl font-bold text-center text-blue-600">LangChain RAG System</h1>
            <p class="text-center text-gray-600 mt-2">Retrieval Augmented Generation with Gemini and Qdrant</p>
        </header>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left Panel: Configuration -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">Configuration</h2>
                
                <!-- URL Input -->
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="url">
                        Web URL
                    </label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" 
                        id="url" type="text" 
                        placeholder="https://example.com/article"
                        name = "url">
                </div>

                <!-- Source Selection -->
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        Document Source
                    </label>
                    <div class="flex items-center">
                        <input id="web" type="radio" name="source" class="h-4 w-4 text-blue-600" checked>
                        <label for="web" class="ml-2 text-sm text-gray-700">Web URL</label>
                    </div>
                    <div class="flex items-center mt-2">
                        <input id="local" type="radio" name="source" class="h-4 w-4 text-blue-600">
                        <label for="local" class="ml-2 text-sm text-gray-700">Local Documents</label>
                    </div>
                </div>

                <!-- Vector Store Selection -->
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        Vector Store
                    </label>
                    <div class="flex items-center">
                        <input id="qdrant" type="radio" name="vectorstore" class="h-4 w-4 text-blue-600" checked>
                        <label for="qdrant" class="ml-2 text-sm text-gray-700">Qdrant</label>
                    </div>
                    <div class="flex items-center mt-2">
                        <input id="faiss" type="radio" name="vectorstore" class="h-4 w-4 text-blue-600">
                        <label for="faiss" class="ml-2 text-sm text-gray-700">FAISS (Local)</label>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col space-y-2">
                    <button id="load-btn" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                        Load Documents
                    </button>
                    <button id="clear-btn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                        Clear All
                    </button>
                </div>
            </div>

            <!-- Middle Panel: Query -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">Query</h2>
                
                <!-- Question Input -->
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="question">
                        Your Question
                    </label>
                    <textarea 
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline h-40" 
                        id="question" 
                        name = "question"
                        placeholder="Enter your question here..."
                    >ChatGPT Plugins?</textarea>
                </div>

                <!-- Submit Button -->
                <button id="submit-btn" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">
                    Generate Answer
                </button>

                <!-- Status Display -->
                <div class="mt-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        Status
                    </label>
                    <div id="status" class="bg-gray-100 p-3 rounded text-sm text-gray-700">
                        Ready
                    </div>
                </div>
            </div>

            <!-- Right Panel: Results -->
            <div class="bg-white rounded-lg shadow p-6 h-full">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">Results</h2>
                
                <!-- Answer Display -->
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        Generated Answer
                    </label>
                    <div id="answer" class="bg-gray-100 p-4 rounded-lg max-h-60 overflow-y-auto prose">
                        <p class="text-gray-500 italic">Answer will appear here...</p>
                    </div>
                </div>

                <!-- Sources Display -->
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        Sources
                    </label>
                    <div id="sources" class="bg-gray-100 p-4 rounded-lg max-h-64 overflow-y-auto">
                        <p class="text-gray-500 italic">Sources will appear here...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- History Panel -->
        <div class="mt-8 bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">Query History</h2>
            <div id="history" class="divide-y divide-gray-200">
                <p class="text-gray-500 italic py-4">Your query history will appear here...</p>
                <!-- History items will be added here -->
            </div>
        </div>
    </div>

    <script>
        document.getElementById('submit-btn').addEventListener('click', async function() {
    // Show loading status
    const statusEl = document.getElementById('status');
    statusEl.textContent = 'Processing...';
    statusEl.classList.add('bg-yellow-100');
    statusEl.classList.remove('bg-gray-100', 'bg-green-100', 'bg-red-100');
    
    // Get the question and URL
    const question = document.getElementById('question').value;
    const url = document.getElementById('url').value;
    
    // Validate inputs
    if (!question.trim() || !url.trim()) {
        statusEl.textContent = 'Error: Please provide both a URL and a question';
        statusEl.classList.add('bg-red-100');
        statusEl.classList.remove('bg-yellow-100');
        return;
    }
    
    try {
        // Make the actual API call to your backend
        const response = await fetch(`/langchain/rag?url=${encodeURIComponent(url)}&question=${encodeURIComponent(question)}`);
        
        if (!response.ok) {
            throw new Error(`Server responded with ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        
        // Update status to success
        statusEl.textContent = 'Completed';
        statusEl.classList.add('bg-green-100');
        statusEl.classList.remove('bg-yellow-100');
        
        // Display the answer using marked (markdown parser)
        // Make sure marked.js is included in your HTML file
        document.getElementById('answer').innerHTML = marked.parse(data.response.answer || data.response);
        
        // Display sources if they exist
        const sourcesDiv = document.getElementById('sources');
        sourcesDiv.innerHTML = '';
        
        if (data.response.sources && Array.isArray(data.response.sources)) {
            data.response.sources.forEach((source, i) => {
                const sourceDiv = document.createElement('div');
                sourceDiv.className = 'mb-3 p-3 border rounded';
                
                // Handle different source formats
                const content = source.content || source.text || '';
                const sourceUrl = source.metadata?.source || source.source || url;
                
                sourceDiv.innerHTML = `
                    <p class="font-semibold">Source ${i + 1}</p>
                    <p class="text-sm">${content.substring(0, 200)}${content.length > 200 ? '...' : ''}</p>
                    <p class="text-xs text-blue-600"><a href="${sourceUrl}" target="_blank">${sourceUrl}</a></p>
                `;
                sourcesDiv.appendChild(sourceDiv);
            });
        } else {
            sourcesDiv.innerHTML = '<p class="text-sm italic">No sources provided</p>';
        }
    } catch (error) {
        console.error('Error:', error);
        
        // Update status to error
        statusEl.textContent = `Error: ${error.message}`;
        statusEl.classList.add('bg-red-100');
        statusEl.classList.remove('bg-yellow-100');
        
        // Clear previous results
        document.getElementById('answer').innerHTML = '';
        document.getElementById('sources').innerHTML = '';
    }
});
                
                // Add to history
        //         const historyDiv = document.getElementById('history');
        //         if (historyDiv.querySelector('.italic')) {
        //             historyDiv.innerHTML = '';
        //         }
                
        //         const historyItem = document.createElement('div');
        //         historyItem.className = 'py-4';
        //         historyItem.innerHTML = `
        //             <p class="font-semibold">${question}</p>
        //             <p class="text-sm text-gray-600 mt-1">${new Date().toLocaleString()}</p>
        //             <p class="text-sm text-gray-600 mt-1">Source: ${document.querySelector('input[name="source"]:checked').id}</p>
        //         `;
        //         historyDiv.prepend(historyItem);
                
        //     }, 2000);
        // });
        
        // Clear button functionality
        document.getElementById('clear-btn').addEventListener('click', function() {
            document.getElementById('question').value = '';
            document.getElementById('url').value = 'https://lilianweng.github.io/posts/2023-06-23-agent/';
            document.getElementById('answer').innerHTML = '<p class="text-gray-500 italic">Answer will appear here...</p>';
            document.getElementById('sources').innerHTML = '<p class="text-gray-500 italic">Sources will appear here...</p>';
            document.getElementById('status').textContent = 'Ready';
            document.getElementById('status').className = 'bg-gray-100 p-3 rounded text-sm text-gray-700';
        });
        
        // Load documents button functionality
        document.getElementById('load-btn').addEventListener('click', function() {
            document.getElementById('status').textContent = 'Loading documents...';
            document.getElementById('status').classList.add('bg-yellow-100');
            document.getElementById('status').classList.remove('bg-gray-100');
            
            setTimeout(() => {
                document.getElementById('status').textContent = 'Documents loaded successfully';
                document.getElementById('status').classList.add('bg-green-100');
                document.getElementById('status').classList.remove('bg-yellow-100');
            }, 1500);
        });
    </script>
</body>
</html>
